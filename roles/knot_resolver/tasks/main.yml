- name: Start and enable Knot Resolver instances
  ansible.builtin.systemd:
    name: "kresd@{{ item }}"
    state: started
    enabled: true
  loop: "{{ range(1, knot_resolver_instances + 1) | list }}"
  tags: [service, knot_resolver]
